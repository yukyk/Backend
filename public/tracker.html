<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/tracker.css">
</head>
<body>
  <div id="app" class="app-container">
    <div id="loginRedirect" class="login-redirect" style="display: none;">
      <h2>Please log in to access the Expense Tracker</h2>
      <button onclick="window.location.href='/login'">Go to Login</button>
    </div>

    <div id="trackerContent" style="display: none;">
      <div id="toast" class="toast"></div>

      <header class="app-header">
        <div class="header-left">
          <h1>Expense Tracker</h1>
          <p>Track your expenses</p>
        </div>
        <div class="header-right">
          <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
      </header>

      <div class="summary-cards">
        <div class="summary-card expense">
          <h3>Total Expenses</h3>
          <div class="amount" id="totalExpenses">$0.00</div>
        </div>
      </div>

      <div class="form-section active">
        <form id="expenseEntryForm">
          <div class="form-group">
            <input type="number" id="expenseAmount" step="0.01" min="0.01" required>
            <label>Amount</label>
          </div>
          <div class="form-group">
            <input type="text" id="expenseDescription" required>
            <label>Description</label>
          </div>
          <div class="form-group">
            <input type="text" id="expenseCategory">
            <label>Category</label>
          </div>
          <button type="submit" class="btn-submit">Add Expense</button>
        </form>
      </div>

      <div class="list-section">
        <h2 class="list-title" id="listTitle">Expenses - Page 1 of 1</h2>

        <div class="pagination" id="pagination"></div>

        <ul class="expense-list" id="expenseList"></ul>

        <div class="pagination" id="paginationBottom"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    var expenses = [];
    var currentPage = 1;
    var itemsPerPage = 10;
    var totalPages = 1;

    function getToken() {
      return localStorage.getItem('token');
    }

    function showToast(message, type) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast toast-' + type;
      toast.style.display = 'block';
      
      setTimeout(function() {
        toast.style.display = 'none';
      }, 3000);
    }

    function updateSummary() {
      var expTotal = 0;
      for (var i = 0; i < expenses.length; i++) {
        expTotal = expTotal + parseFloat(expenses[i].amount || 0);
      }
      document.getElementById('totalExpenses').textContent = '$' + expTotal.toFixed(2);
    }

    function updatePagination() {
      totalPages = Math.ceil(expenses.length / itemsPerPage);
      if (totalPages === 0) totalPages = 1;
      
      if (currentPage > totalPages) {
        currentPage = 1;
      }
      
      document.getElementById('listTitle').textContent = 'Expenses - Page ' + currentPage + ' of ' + totalPages;

      var html = '';
      html = html + '<button class="pagination-btn" onclick="changePage(1)"';
      if (currentPage === 1) html = html + ' disabled';
      html = html + '>««</button>';

      html = html + '<button class="pagination-btn" onclick="changePage(' + (currentPage - 1) + ')"';
      if (currentPage === 1) html = html + ' disabled';
      html = html + '>« Prev</button>';

      var showPages = 5;
      var start = currentPage - 2;
      if (start < 1) start = 1;
      
      var end = start + showPages - 1;
      if (end > totalPages) end = totalPages;
      
      if (end - start + 1 < showPages) {
        start = end - showPages + 1;
        if (start < 1) start = 1;
      }

      for (var i = start; i <= end; i++) {
        html = html + '<button class="pagination-btn';
        if (currentPage === i) {
          html = html + ' active';
        }
        html = html + '" onclick="changePage(' + i + ')">' + i + '</button>';
      }

      html = html + '<button class="pagination-btn" onclick="changePage(' + (currentPage + 1) + ')"';
      if (currentPage === totalPages) html = html + ' disabled';
      html = html + '>Next »</button>';

      html = html + '<button class="pagination-btn" onclick="changePage(' + totalPages + ')"';
      if (currentPage === totalPages) html = html + ' disabled';
      html = html + '>»»</button>';

      html = html + '<span class="pagination-info">Page ' + currentPage + ' of ' + totalPages + '</span>';

      document.getElementById('pagination').innerHTML = html;
      document.getElementById('paginationBottom').innerHTML = html;
    }

    function changePage(page) {
      currentPage = page;
      renderList();
    }

    function renderList() {
      var indexOfLastItem = currentPage * itemsPerPage;
      var indexOfFirstItem = indexOfLastItem - itemsPerPage;
      var currentItemsPage = expenses.slice(indexOfFirstItem, indexOfLastItem);

      var listEl = document.getElementById('expenseList');
      
      if (currentItemsPage.length === 0) {
        listEl.innerHTML = '<li class="empty-message">No expenses yet</li>';
        return;
      }

      var html = '';
      for (var i = 0; i < currentItemsPage.length; i++) {
        var item = currentItemsPage[i];
        var amount = parseFloat(item.amount).toFixed(2);
        
        html = html + '<li class="expense-item">';
        html = html + '<div class="expense-info">';
        html = html + '<span class="expense-amount">-$' + amount + '</span>';
        html = html + '<span class="expense-desc">' + item.description + '</span>';
        html = html + '<span class="expense-category">' + item.category + '</span>';
        html = html + '</div>';
        html = html + '<div class="expense-actions">';
        html = html + '<button class="btn-delete" onclick="deleteItem(' + item.id + ')">Delete</button>';
        html = html + '</div>';
        html = html + '</li>';
      }

      listEl.innerHTML = html;
    }

    async function fetchData() {
      var token = getToken();
      if (!token) return;

      try {
        var expenseRes = await axios.get('/api/auth/get-expenses');
        expenses = expenseRes.data || [];

        updateSummary();
        updatePagination();
        renderList();
      } catch (error) {
        console.log('Error fetching data:', error);
        showToast('Failed to fetch data', 'error');
      }
    }

    async function addExpense(e) {
      e.preventDefault();

      var amount = document.getElementById('expenseAmount').value;
      var description = document.getElementById('expenseDescription').value;
      var category = document.getElementById('expenseCategory').value;
      
      if (category === '') {
        category = 'Uncategorized';
      }

      try {
        await axios.post('/api/auth/add-expense', {
          amount: parseFloat(amount),
          description: description,
          category: category,
          status: 'pending'
        });

        document.getElementById('expenseAmount').value = '';
        document.getElementById('expenseDescription').value = '';
        document.getElementById('expenseCategory').value = '';
        
        showToast('Expense added successfully!', 'success');
        fetchData();
      } catch (error) {
        console.log('Error adding expense:', error);
        var errorMsg = 'Failed to add expense';
        if (error.response && error.response.data && error.response.data.error) {
          errorMsg = error.response.data.error;
        }
        showToast(errorMsg, 'error');
      }
    }

    async function deleteItem(id) {
      var confirmDelete = confirm('Are you sure you want to delete this expense?');
      if (!confirmDelete) return;

      try {
        await axios.delete('/api/auth/delete-expense/' + id);
        showToast('Expense deleted!', 'success');
        fetchData();
      } catch (error) {
        console.log('Error deleting item:', error);
        showToast('Failed to delete item', 'error');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login';
    }

    function setupAxios() {
      axios.interceptors.request.use(function(config) {
        var token = localStorage.getItem('token');
        if (token) {
          config.headers.Authorization = 'Bearer ' + token;
        }
        return config;
      });
    }

    function init() {
      var token = getToken();
      
      if (!token) {
        document.getElementById('loginRedirect').style.display = 'flex';
        document.getElementById('trackerContent').style.display = 'none';
        return;
      }

      setupAxios();

      document.getElementById('loginRedirect').style.display = 'none';
      document.getElementById('trackerContent').style.display = 'block';

      document.getElementById('expenseEntryForm').addEventListener('submit', addExpense);
      document.getElementById('logoutBtn').addEventListener('click', logout);

      fetchData();
    }

    init();
  </script>
</body>
</html>
