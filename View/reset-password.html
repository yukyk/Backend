<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Advance Expense Tracker</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .reset-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .reset-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .reset-header p {
            color: #666;
            font-size: 14px;
        }
        .success-icon {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .success-icon .checkmark-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #d4edda;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease;
        }
        .success-icon .checkmark {
            width: 50px;
            height: 50px;
            stroke: #28a745;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .success-icon .checkmark path {
            animation: drawCheck 0.5s ease forwards;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #635BFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .countdown {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
        
        /* Password toggle styles */
        .password-input-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: #666;
            transition: color 0.3s;
        }
        .password-toggle:hover {
            color: #635BFF;
        }
        .password-toggle svg {
            width: 20px;
            height: 20px;
            display: block;
        }
        .input-group .password-input-wrapper input {
            padding-right: 50px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <!-- Loading State -->
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Validating your reset link...</p>
            </div>

            <!-- Error State -->
            <div id="errorState" style="display: none;">
                <div class="reset-header">
                    <h1>⚠️ Invalid Link</h1>
                    <p id="errorMessage">This reset link is invalid or has expired.</p>
                </div>
                <button onclick="goToLogin()" class="submit-btn">Go to Login</button>
            </div>

            <!-- Reset Form -->
            <div id="resetForm" style="display: none;">
                <div class="reset-header">
                    <h1>🔑 Set New Password</h1>
                    <p>Enter your new password below</p>
                </div>

                <div id="formError" class="error-message" style="display: none;"></div>

                <form id="passwordResetForm">
                    <div class="input-group">
                        <div class="password-input-wrapper">
                            <input type="password" id="newPassword" required placeholder=" " minlength="6">
                            <label>New Password</label>
                            <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)" aria-label="Toggle password visibility">
                                <!-- Eye icon (show password) -->
                                <svg class="eye-show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <!-- Eye-off icon (hide password) - hidden by default -->
                                <svg class="eye-hide" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display:none;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                </svg>
                            </button>
                        </div>
                        <div class="input-border"></div>
                    </div>
                    <div class="input-group">
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" required placeholder=" " minlength="6">
                            <label>Confirm Password</label>
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Toggle password visibility">
                                <!-- Eye icon (show password) -->
                                <svg class="eye-show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <!-- Eye-off icon (hide password) - hidden by default -->
                                <svg class="eye-hide" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display:none;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                </svg>
                            </button>
                        </div>
                        <div class="input-border"></div>
                    </div>
                    <button type="submit" id="submitBtn" class="submit-btn">Reset Password</button>
                </form>
                <div class="countdown" id="expiryCountdown"></div>
            </div>

            <!-- Success State -->
            <div id="successState" class="success-icon" style="display: none;">
                <div class="checkmark-circle">
                    <svg class="checkmark" viewBox="0 0 50 50">
                        <path pathlength="100" d="M14 27 L22 35 L36 16" />
                    </svg>
                </div>
                <h2 style="color: #28a745; margin: 0 0 10px;">Password Reset Successful!</h2>
                <p style="color: #666;">You can now login with your new password.</p>
                <button onclick="goToLogin()" class="submit-btn" style="margin-top: 20px;">Go to Login</button>
            </div>
        </div>
    </div>

    <script>
        let token = null;
        let expiresAt = null;

        // Toggle password visibility
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeShow = button.querySelector('.eye-show');
            const eyeHide = button.querySelector('.eye-hide');
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeShow.style.display = 'none';
                eyeHide.style.display = 'block';
            } else {
                input.type = 'password';
                eyeShow.style.display = 'block';
                eyeHide.style.display = 'none';
            }
        }

        // Get token from URL
        function getTokenFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        // Verify token on page load
        async function verifyToken() {
            token = getTokenFromUrl();
            
            if (!token) {
                showError('No token provided. Please use the link from your email.');
                return;
            }

            try {
                const response = await fetch(`/api/password/verifytoken?token=${encodeURIComponent(token)}`);
                const data = await response.json();

                if (data.valid) {
                    showResetForm(data.expiresIn);
                } else {
                    showError(data.message || 'This reset link is invalid or has expired.');
                }
            } catch (error) {
                console.error('Token verification error:', error);
                showError('Failed to verify token. Please try again.');
            }
        }

        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }

        function showResetForm(expiresIn) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('resetForm').style.display = 'block';
            document.getElementById('expiryCountdown').textContent = `Link expires in: ${expiresIn}`;
        }

        function showSuccess() {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        }

        function goToLogin() {
            window.location.href = '/login';
        }

        // Handle form submission
        document.getElementById('passwordResetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('formError');
            const submitBtn = document.getElementById('submitBtn');

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            // Validate password length
            if (newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/password/resetpassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess();
                } else {
                    errorDiv.textContent = data.message || 'Failed to reset password';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Reset password error:', error);
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });

        // Initialize on page load
        verifyToken();
    </script>
</body>
</html>
