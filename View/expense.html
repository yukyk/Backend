<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .page-title {
      margin: 0;
      font-size: 32px;
      color: #1a1f36;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .premium-btn {
      background: linear-gradient(135deg, #635BFF, #5245d8);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .premium-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(99, 91, 255, 0.3);
    }

    .premium-btn.faded {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .premium-btn.faded:hover {
      transform: none;
      box-shadow: none;
    }

    .premium-btn.faded::after {
      content: "🔒";
      margin-left: 8px;
    }

    .premium-badge {
      background: #27ae60;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
    }

    html body.premium-user,
    body.premium-user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-color: #667eea !important;
      background-attachment: fixed !important;
      min-height: 100vh !important;
      width: 100% !important;
      position: relative !important;
      display: block !important;
      padding: 20px !important;
    }
    
    html.premium-user body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    }
    
    body.premium-user[style] {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    }
    
    body.premium-user::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: -1;
    }
    
    body.premium-user > * {
      position: relative;
      z-index: 1;
    }
    
    body.premium-user .login-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 0;
    }
    
    body.premium-user .login-card {
      background: rgba(255, 255, 255, 0.97) !important;
      box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.3);
      width: 100% !important;
      max-width: 950px !important;
    }

    body.premium-user .page-header h1 {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .premium-star-indicator {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: white;
      padding: 15px 10px;
      border-radius: 10px 0 0 10px;
      font-size: 20px;
      font-weight: bold;
      z-index: 9999;
      box-shadow: -3px 0 15px rgba(243, 156, 18, 0.5);
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 2px;
    }

    .premium-star-indicator::before {
      content: '⭐';
      font-size: 24px;
    }

    .leaderboard-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .leaderboard-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
    }

    .leaderboard-btn.locked {
      background: linear-gradient(135deg, #bdc3c7, #95a5a6);
      cursor: not-allowed;
      opacity: 0.4;
      pointer-events: none;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }

    .inline-edit-input {
      transition: all 0.3s ease;
      font-size: 14px;
    }
    
    .inline-edit-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.3);
      border-color: #635BFF !important;
    }

    .editing-row {
      background: linear-gradient(90deg, rgba(99, 91, 255, 0.08) 0%, rgba(99, 91, 255, 0.03) 100%);
      border-radius: 12px;
      padding: 16px !important;
      border: 2px solid rgba(99, 91, 255, 0.3);
      box-shadow: 0 4px 12px rgba(99, 91, 255, 0.1);
    }

    .edit-input-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      border: 1px solid #e3e8ee;
    }

    .edit-input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .edit-input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .edit-input-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7385;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .inline-edit-input.inline-edit-amount {
      width: 120px;
      text-align: right;
    }

    .edit-actions-container {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .edit-save-btn {
      background: linear-gradient(135deg, #27ae60, #219a52) !important;
      color: white !important;
      border: none !important;
      padding: 10px 20px !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3) !important;
    }

    .edit-cancel-btn {
      background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
      color: white !important;
      border: none !important;
      padding: 10px 20px !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3) !important;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: linear-gradient(135deg, #635BFF, #5245d8);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .summary-card.expense {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .summary-card h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .summary-card .amount {
      font-size: 28px;
      font-weight: 700;
    }

    .expense-section {
      margin-top: 20px;
    }

    .expense-section-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1f36;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">

      <div class="page-header">
        <div>
          <h1 style="margin: 0 0 5px 0;">Expense Tracker</h1>
          <p style="margin: 0;">Manage your expenses and income</p>
        </div>
        <div class="header-buttons">
          <button class="logout-btn" onclick="logout()">
            🚪 Logout
          </button>
          <button type="button" class="leaderboard-btn" onclick="handleLeaderboard()" id="leaderboardBtn">
            🏆 Leaderboard
          </button>
          <button type="button" class="premium-btn" id="premiumBtn" onclick="goToPremium()">
            💎 Buy Premium
          </button>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="summary-cards" id="summaryCards">
        <div class="summary-card expense">
          <h3>💸 Total Expenses</h3>
          <div class="amount" id="totalExpenses">$0.00</div>
        </div>
      </div>

      <!-- Expense Form Section -->
      <div id="expenseFormSection" class="form-section active" style="display: block !important;">
        <form id="expenseForm" class="login-form" style="display: block !important;">

          <div class="input-group">
            <input type="number" id="amount" required placeholder=" ">
            <label>Amount</label>
            <div class="input-border"></div>
          </div>

          <div class="input-group">
            <input type="text" id="description" required placeholder=" ">
            <label>Description</label>
            <div class="input-border"></div>
          </div>

          <label for="category">Choose a category:</label>
          <input type="text" id="category" name="category" placeholder="AI will suggest..." style="width:100%; padding:12px; border:1px solid #e3e8ee; border-radius:6px; font-size:16px;">
          <div id="ai-suggestion-container"></div>
          
          <button id="aiInsightsBtn" class="ai-insights-btn" type="button" onclick="handleInsights()">
            🧠 AI Insights
          </button>
          <br><br>

          <button type="submit" class="submit-btn">💸 Add Expense</button>

        </form>
      </div>

      <!-- Expense List -->
      <div class="expense-section">
        <h2 class="expense-section-title" id="listTitle">
          📋 All Expenses
        </h2>
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
          <label for="dateRangeStart" style="font-weight: 600; color: #6b7385;">From:</label>
          <input type="date" id="dateRangeStart" onchange="applyDateRangeFilter()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer;">
          <label for="monthFilter" style="font-weight: 600; color: #6b7385;">Month:</label>
          <select id="monthFilter" onchange="applyDateRangeFilter()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer;">
            <option value="">All months</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <label for="yearFilter" style="font-weight: 600; color: #6b7385;">Year:</label>
          <select id="yearFilter" onchange="applyDateRangeFilter()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer;"></select>
          <button type="button" onclick="resetDateFilters()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer; background: #fff;">Reset</button>
          <button type="button" id="exportBtn" onclick="exportExpenses()" style="padding: 8px 12px; border: 2px solid #635BFF; border-radius: 6px; font-size: 14px; cursor: pointer; background: #635BFF; color: white;">⬇ Export</button>
          <label for="itemsPerPage" style="font-weight: 600; color: #6b7385;">Show:</label>
          <select id="itemsPerPage" onchange="changeItemsPerPage()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer;">
            <option value="5">5 items</option>
            <option value="10">10 items</option>
            <option value="15">15 items</option>
            <option value="20">20 items</option>
          </select>
        </div>
        <ul id="expenseList" style="list-style:none;padding-left:0;"></ul>
        <div class="pagination-controls" id="paginationControls" style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px;">
          <button id="prevPageBtn" onclick="prevPage()" style="padding: 10px 20px; background: #635BFF; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px;">◀</button>
          <span id="pageInfo" style="font-weight: 600; color: #1a1f36;">Page 1</span>
          <button id="nextPageBtn" onclick="nextPage()" style="padding: 10px 20px; background: #635BFF; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px;">▶</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: white; padding: 20px; border-radius: 8px; max-width: 500px; width: 90%; max-height: 70%; overflow-y: auto;">
      <h2>🏆 Expense Leaderboard</h2>
      <div id="leaderboardList"></div>
      <button onclick="closeModal()" style="margin-top: 20px; padding: 10px 20px; background: #635BFF; color: white; border: none; border-radius: 5px; cursor: pointer;">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/script.js"></script>
  <script>
    let currentCategory = 'all';
    let currentTimeFilter = 'all';
    let currentViewType = 'expense';
    let hasPremiumStatus = false;
    let currentPage = 1;
    let itemsPerPage = parseInt(localStorage.getItem('expensesPerPage')) || 5;
    let filteredItemsData = [];

    document.addEventListener('DOMContentLoaded', function() {
      const savedItemsPerPage = localStorage.getItem('expensesPerPage');
      if (savedItemsPerPage) {
        itemsPerPage = parseInt(savedItemsPerPage);
        document.getElementById('itemsPerPage').value = itemsPerPage;
      }

      const yearFilter = document.getElementById('yearFilter');
      if (yearFilter) {
        const currentYear = new Date().getFullYear();
        const startYear = currentYear - 5;
        for (let year = currentYear; year >= startYear; year--) {
          const option = document.createElement('option');
          option.value = year;
          option.textContent = year;
          yearFilter.appendChild(option);
        }
      }

      const expenseForm = document.getElementById('expenseForm');
      if (expenseForm) {
        expenseForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          if (!checkAuth()) return;
          
          const amountEl = document.getElementById('amount');
          const descriptionEl = document.getElementById('description');
          const categoryEl = document.getElementById('category');
          
          const amount = parseFloat(amountEl.value.trim());
          const description = descriptionEl.value.trim();
          const category = categoryEl.value.trim() || 'Uncategorized';

          if (!amount || !description || amount <= 0) {
            showToast('Please enter a valid amount and description', 'error');
            return;
          }

          try {
            await axios.post('/api/auth/add-expense', { 
              amount, 
              description, 
              category,
              status: 'pending' 
            });
            
            expenseForm.reset();
            showToast('Expense added successfully!', 'success');
            fetchAndRenderEntries(); 
          } catch (err) {
            console.error('Add expense error:', err);
            showToast(err.response?.data?.error || 'Failed to add entry', 'error');
          }
        });
      }

      const descriptionEl = document.getElementById('description');
      if (descriptionEl) {
        let aiTimeout;
        descriptionEl.addEventListener('input', () => {
          const desc = descriptionEl.value.trim();
          if (desc.length < 3) return;
          clearTimeout(aiTimeout);
          aiTimeout = setTimeout(async () => {
            try {
              const res = await axios.get(`/api/auth/suggest-category?description=${encodeURIComponent(desc)}`);
              const { suggestedCategory } = res.data;
              const categoryEl = document.getElementById('category');
              if (suggestedCategory && categoryEl) {
                categoryEl.value = suggestedCategory;
                if (typeof window.showAISuggestion === 'function') {
                  window.showAISuggestion(suggestedCategory);
                }
              }
            } catch (err) {
              console.error("AI Suggestion fallback link broken", err);
            }
          }, 500);
        });
      }
    });

    function changeItemsPerPage() {
      itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
      localStorage.setItem('expensesPerPage', itemsPerPage);
      currentPage = 1;
      renderEntries(window.allExpenses);
    }

    function changeCategoryFilter() {
      currentCategory = 'all';
      currentPage = 1;
      renderEntries(window.allExpenses);
      updateListTitle();
    }

    function getExpenseRequestParams() {
      const params = {};
      const startDate = getSelectedStartDate();
      if (startDate) {
        params.from = `${startDate.getFullYear()}-${String(startDate.getMonth() + 1).padStart(2, '0')}-${String(startDate.getDate()).padStart(2, '0')}`;
      }
      const monthValue = document.getElementById('monthFilter').value;
      const yearValue = document.getElementById('yearFilter').value;
      if (monthValue) params.month = monthValue;
      if (yearValue) params.year = yearValue;
      return params;
    }
    window.getExpenseRequestParams = getExpenseRequestParams;

    function applyDateRangeFilter() {
      currentPage = 1;
      fetchAndRenderEntries();
      updateListTitle();
    }

    function resetDateFilters() {
      document.getElementById('dateRangeStart').value = '';
      document.getElementById('monthFilter').value = '';
      document.getElementById('yearFilter').value = '';
      currentCategory = 'all';
      currentPage = 1;
      fetchAndRenderEntries();
      updateListTitle();
    }

    function getSelectedStartDate() {
      const dateValue = document.getElementById('dateRangeStart').value;
      if (dateValue) {
        const [year, month, day] = dateValue.split('-').map(Number);
        return new Date(year, month - 1, day);
      }

      const monthValue = document.getElementById('monthFilter').value;
      const yearValue = document.getElementById('yearFilter').value;
      if (monthValue || yearValue) {
        const selectedYear = yearValue ? Number(yearValue) : new Date().getFullYear();
        const selectedMonth = monthValue ? Number(monthValue) - 1 : 0;
        return new Date(selectedYear, selectedMonth, 1);
      }
      return null;
    }

    function getFilterLabel() {
      const dateValue = document.getElementById('dateRangeStart').value;
      if (dateValue) {
        const dateObj = new Date(dateValue + 'T00:00:00');
        return `Expenses from ${dateObj.toLocaleDateString()} to today`;
      }

      const monthValue = document.getElementById('monthFilter').value;
      const yearValue = document.getElementById('yearFilter').value;
      if (monthValue && yearValue) {
        const selectedMonth = new Date(Number(yearValue), Number(monthValue) - 1, 1);
        return `Expenses from ${selectedMonth.toLocaleString('en-US', { month: 'long' })} ${yearValue} to today`;
      }

      if (yearValue) return `Expenses from ${yearValue} to today`;

      if (monthValue) {
        const currentYear = new Date().getFullYear();
        const selectedMonth = new Date(currentYear, Number(monthValue) - 1, 1);
        return `Expenses from ${selectedMonth.toLocaleString('en-US', { month: 'long' })} to today`;
      }
      return '';
    }

    function updateListTitle() {
      const customLabel = getFilterLabel();
      document.getElementById('listTitle').textContent = customLabel || '📋 All Expenses';
    }

    async function checkPremiumStatus() {
      const token = getToken();
      if (!token) return;

      try {
        const response = await axios.get('/api/payment/premium-status');
        const { isPremium, premiumTier = 0 } = response.data;
        hasPremiumStatus = isPremium;
        
        if (isPremium) {
          document.body.classList.add('premium-user');
          document.body.style.cssText = 'background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; background-attachment: fixed !important; min-height: 100vh; display: block;';
          
          const headerDiv = document.querySelector('.page-header > div > h1');
          if (headerDiv) {
            headerDiv.innerHTML = `Expense Tracker <span style="background: linear-gradient(135deg, #f39c12, #e67e22); color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-left: 10px;">⭐ ${premiumTier === 3 ? 'ELITE' : premiumTier === 2 ? 'PLUS' : 'BASIC'}</span>`;
          }
          
          let starIndicator = document.getElementById('premiumStarIndicator');
          if (!starIndicator) {
            starIndicator = document.createElement('div');
            starIndicator.id = 'premiumStarIndicator';
            starIndicator.className = 'premium-star-indicator';
            starIndicator.textContent = premiumTier === 3 ? 'ELITE' : premiumTier === 2 ? 'PLUS' : 'BASIC';
            document.body.appendChild(starIndicator);
          } else {
            starIndicator.style.display = 'block';
          }
        } else {
          document.body.classList.remove('premium-user');
          document.body.style.background = '';
          const starIndicator = document.getElementById('premiumStarIndicator');
          if (starIndicator) starIndicator.style.display = 'none';
        }
        
        const premiumBtn = document.getElementById('premiumBtn');
        const leaderboardBtn = document.getElementById('leaderboardBtn');
        
        if (isPremium) {
          const tierNames = ['Free', 'Basic', 'Plus', 'Elite'];
          const tierName = tierNames[premiumTier] || 'Premium';
          
          if (premiumTier < 3) {
            premiumBtn.innerHTML = `✓ ${tierName} Member <span class="premium-badge">UPGRADE</span>`;
            premiumBtn.disabled = false;
            premiumBtn.classList.remove('faded');
          } else {
            premiumBtn.innerHTML = `✓ ${tierName} Member <span class="premium-badge">ACTIVE</span>`;
            premiumBtn.disabled = true;
            premiumBtn.style.opacity = '0.7';
          }
          
          leaderboardBtn.classList.remove('locked');
          leaderboardBtn.innerHTML = '🏆 Leaderboard';
          const exportBtn = document.getElementById('exportBtn');
          if (exportBtn) {
            exportBtn.style.opacity = premiumTier >= 2 ? '1' : '0.6';
            exportBtn.style.cursor = premiumTier >= 2 ? 'pointer' : 'not-allowed';
            exportBtn.title = premiumTier >= 2 ? 'Export expenses as Excel' : 'Premium Plus required';
          }
        } else {
          leaderboardBtn.classList.add('locked');
          leaderboardBtn.innerHTML = '🔒 Leaderboard';
          premiumBtn.classList.add('faded');
          const exportBtn = document.getElementById('exportBtn');
          if (exportBtn) {
            exportBtn.style.opacity = '0.6';
            exportBtn.style.cursor = 'not-allowed';
            exportBtn.title = 'Premium Plus required';
          }
        }
      } catch (error) {
        console.error('Error checking premium status:', error);
      }
    }

    function setViewType(type) {
      currentViewType = type;
      fetchAndRenderEntries();
    }

    async function fetchAndRenderEntries() {
      if (!checkAuth()) return;
      try {
        const expenseRes = await axios.get('/api/auth/get-expenses', { params: getExpenseRequestParams() });
        window.allExpenses = expenseRes.data || [];
        renderEntries(window.allExpenses);
      } catch (err) {
        console.error('Error fetching entries:', err);
      }
    }

    function showExportFormatChooser() {
      const existingModal = document.getElementById('exportFormatModal');
      if (existingModal) {
        existingModal.remove();
      }

      const modal = document.createElement('div');
      modal.id = 'exportFormatModal';
      modal.style.cssText = `
        position: fixed;
        inset: 0;
        background: rgba(10, 15, 30, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 20px;
      `;

      modal.innerHTML = `
        <div style="background: white; border-radius: 12px; padding: 24px; width: min(90vw, 360px); box-shadow: 0 16px 40px rgba(0,0,0,0.2);">
          <h3 style="margin: 0 0 10px; color: #1a1f36;">Choose export format</h3>
          <p style="margin: 0 0 18px; color: #6b7385;">Download your current expenses as Excel or PDF.</p>
          <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" id="exportExcelBtn" style="padding: 10px 14px; border: none; border-radius: 8px; background: #635BFF; color: white; cursor: pointer; font-weight: 600;">📊 Excel</button>
            <button type="button" id="exportPdfBtn" style="padding: 10px 14px; border: none; border-radius: 8px; background: #27ae60; color: white; cursor: pointer; font-weight: 600;">📄 PDF</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          modal.remove();
        }
      });

      document.getElementById('exportExcelBtn').addEventListener('click', () => {
        modal.remove();
        downloadExportFile('excel');
      });

      document.getElementById('exportPdfBtn').addEventListener('click', () => {
        modal.remove();
        downloadExportFile('pdf');
      });
    }

    async function downloadExportFile(format) {
      const exportBtn = document.getElementById('exportBtn');
      if (exportBtn) {
        exportBtn.disabled = true;
        exportBtn.textContent = 'Preparing...';
      }

      try {
        const premiumStatus = await axios.get('/api/payment/premium-status');
        if (!premiumStatus.data?.isPremium || (premiumStatus.data?.premiumTier || 0) < 2) {
          showToast('Export is available for Premium Plus and above.', 'info');
          return;
        }

        const params = getExpenseRequestParams();
        const response = await axios.get('/api/auth/export-expenses', {
          params: { ...params, format },
          responseType: 'blob'
        });

        const extension = format === 'pdf' ? 'pdf' : 'xlsx';
        const mimeType = format === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        const blob = new Blob([response.data], { type: mimeType });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `expenses-report.${extension}`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.URL.revokeObjectURL(url);
        showToast(`Expenses exported as ${format.toUpperCase()}.`, 'success');
      } catch (err) {
        console.error('Export failed', err);
        showToast(err.response?.data?.error || 'Export failed', 'error');
      } finally {
        if (exportBtn) {
          exportBtn.disabled = false;
          exportBtn.textContent = '⬇ Export';
        }
      }
    }

    async function exportExpenses() {
      if (!checkAuth()) return;

      try {
        const premiumStatus = await axios.get('/api/payment/premium-status');
        if (!premiumStatus.data?.isPremium || (premiumStatus.data?.premiumTier || 0) < 2) {
          showToast('Export is available for Premium Plus and above.', 'info');
          return;
        }

        showExportFormatChooser();
      } catch (err) {
        console.error('Export access check failed', err);
        showToast('Unable to check export access', 'error');
      }
    }
    window.exportExpenses = exportExpenses;

    function renderEntries(items) {
      const list = document.getElementById('expenseList');
      list.innerHTML = '';

      if (!items || items.length === 0) {
        showEmptyMessage(list, 'No expenses yet');
        return;
      }

      const filteredItems = filterByCategory(items);
      filteredItemsData = filteredItems;
      const totalExpense = filteredItems.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
      const totalExpensesEl = document.getElementById('totalExpenses');
      if (totalExpensesEl) {
        totalExpensesEl.textContent = '$' + totalExpense.toFixed(2);
      }
      
      if (filteredItemsData.length === 0) {
        showEmptyMessage(list, 'No expenses found');
        return;
      }

      updatePaginationControls();
      renderPaginatedItems();
    }

    function showEmptyMessage(listElement, message) {
      const empty = document.createElement('li');
      empty.textContent = message;
      empty.style.cssText = 'color: #8792a2; padding: 20px; text-align: center;';
      listElement.appendChild(empty);
      document.getElementById('paginationControls').style.display = 'none';
    }

    function updatePaginationControls() {
      const totalPages = Math.ceil(filteredItemsData.length / itemsPerPage);
      const paginationControls = document.getElementById('paginationControls');
      const pageInfo = document.getElementById('pageInfo');
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');

      if (totalPages <= 1) {
        paginationControls.style.display = 'none';
        return;
      }

      paginationControls.style.display = 'flex';
      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      prevBtn.style.opacity = currentPage === 1 ? '0.5' : '1';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.style.opacity = currentPage === totalPages ? '0.5' : '1';
    }

    function nextPage() {
      const totalPages = Math.ceil(filteredItemsData.length / itemsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderPaginatedItems();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPaginatedItems();
      }
    }

    function renderPaginatedItems() {
      const list = document.getElementById('expenseList');
      list.innerHTML = '';
      
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedItems = filteredItemsData.slice(startIndex, endIndex);

      paginatedItems.forEach(item => {
        if (typeof window.renderExpenses === 'function') {
          const li = createListItem(item, 'expense');
          list.appendChild(li);
        }
      });
      updatePaginationControls();
    }

    function filterByCategory(items) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startDate = getSelectedStartDate();
      const hasDateRangeFilter = Boolean(startDate);
      const normalizedStartDate = startDate ? new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()) : null;

      return items.filter(item => {
        const itemDate = new Date(item.createdAt);
        if (!itemDate || Number.isNaN(itemDate.getTime())) return false;

        const normalizedItemDate = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());

        if (hasDateRangeFilter) {
          return normalizedItemDate >= normalizedStartDate && normalizedItemDate <= today;
        }

        return true;
      });
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        if (checkAuth()) {
          checkPremiumStatus();
          fetchAndRenderEntries();
        }
      }, 100);
    });

    window.renderEntries = renderEntries;
    window.fetchAndRenderEntries = fetchAndRenderEntries;
    window.changeCategoryFilter = changeCategoryFilter;
    window.changeItemsPerPage = changeItemsPerPage;
    window.nextPage = nextPage;
    window.prevPage = prevPage;
    window.applyDateRangeFilter = applyDateRangeFilter;
    window.resetDateFilters = resetDateFilters;
  </script>
</body>
</html>
