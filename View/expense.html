<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
</body>

  <div class="login-container">
    <div class="login-card" style="max-width:680px; width:100%;">

      <div class="login-header">
        <h1>Expense Tracker</h1>
        <p>Add and view your expenses</p>
      </div>

      <form id="expenseForm" class="login-form">

        <div class="input-group">
          <input type="number" id="amount" required placeholder=" ">
          <label>Amount</label>
          <div class="input-border"></div>
        </div>

        <div class="input-group">
          <input type="text" id="description" required placeholder=" ">
          <label>Description</label>
          <div class="input-border"></div>
        </div>

       
  <label for="category">Choose a category:</label>
  <select name="category" id="category">
    <option value="Food">Food</option>
    <option value="Transportation">Transportation</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Utilities">Utilities</option>
  </select>
  <br><br>

        <button type="submit" class="submit-btn">Add Expense</button>

      </form>

      <div style="margin-top:20px">
        <ul id="expenseList" style="list-style:none;padding-left:0;"></ul>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
