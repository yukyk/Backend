<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .page-title {
      margin: 0;
      font-size: 32px;
      color: #1a1f36;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .premium-btn {
      background: linear-gradient(135deg, #635BFF, #5245d8);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .premium-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(99, 91, 255, 0.3);
    }

    .premium-btn.faded {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .premium-btn.faded:hover {
      transform: none;
      box-shadow: none;
    }

    .premium-btn.faded::after {
      content: "🔒";
      margin-left: 8px;
    }

    .premium-badge {
      background: #27ae60;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
    }

    /* Premium User Background - Override all body styles */
    html body.premium-user,
    html body.premium-user,
    body.premium-user,
    body.premium-user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-color: #667eea !important;
      background-attachment: fixed !important;
      min-height: 100vh !important;
      width: 100% !important;
      position: relative !important;
      display: block !important;
      padding: 20px !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
    }
    
    html.premium-user body,
    html.premium-user body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    }
    
    /* Target inline style overrides */
    body.premium-user[style] {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
      background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    }
    
    body.premium-user::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: -1;
    }
    
    body.premium-user > * {
      position: relative;
      z-index: 1;
    }
    
    body.premium-user .login-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 0;
    }
    
    body.premium-user .login-card {
      background: rgba(255, 255, 255, 0.97) !important;
      box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.3);
      width: 100% !important;
      max-width: 950px !important;
    }

    body.premium-user .page-header h1 {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Premium Star Indicator */
    .premium-star-indicator {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: white;
      padding: 15px 10px;
      border-radius: 10px 0 0 10px;
      font-size: 20px;
      font-weight: bold;
      z-index: 9999;
      box-shadow: -3px 0 15px rgba(243, 156, 18, 0.5);
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 2px;
    }

    .premium-star-indicator::before {
      content: '⭐';
      font-size: 24px;
    }

    .leaderboard-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .leaderboard-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
    }

    .leaderboard-btn.locked {
      background: linear-gradient(135deg, #bdc3c7, #95a5a6);
      cursor: not-allowed;
      opacity: 0.4;
      pointer-events: none;
    }

    .leaderboard-btn.locked:hover {
      transform: none;
      box-shadow: none;
    }

    .leaderboard-btn.locked::after {
      content: "🔒";
      margin-left: 8px;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }

    /* Inline Edit Styles - Enhanced for better visibility */
    .inline-edit-input {
      transition: all 0.3s ease;
      font-size: 14px;
    }
    
    .inline-edit-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.3);
      border-color: #635BFF !important;
    }

    .editing-row {
      background: linear-gradient(90deg, rgba(99, 91, 255, 0.08) 0%, rgba(99, 91, 255, 0.03) 100%);
      border-radius: 12px;
      padding: 16px !important;
      border: 2px solid rgba(99, 91, 255, 0.3);
      box-shadow: 0 4px 12px rgba(99, 91, 255, 0.1);
    }

    /* Edit input bar container */
    .edit-input-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      border: 1px solid #e3e8ee;
    }

    .edit-input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .edit-input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .edit-input-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7385;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .inline-edit-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e3e8ee;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      color: #1a1f36;
      background: white;
    }

    .inline-edit-input.inline-edit-amount {
      width: 120px;
      text-align: right;
    }

    .edit-actions-container {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .edit-save-btn {
      background: linear-gradient(135deg, #27ae60, #219a52) !important;
      color: white !important;
      border: none !important;
      padding: 10px 20px !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 2px 8px rgba(39, 174, 96, 0.3) !important;
    }

    .edit-save-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4) !important;
    }

    .edit-cancel-btn {
      background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
      color: white !important;
      border: none !important;
      padding: 10px 20px !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3) !important;
    }

    .edit-cancel-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4) !important;
    }

    .amount.animate-pulse {
      animation: pulse 0.3s ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Summary Cards */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: linear-gradient(135deg, #635BFF, #5245d8);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .summary-card.expense {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

    .summary-card.income {
      background: linear-gradient(135deg, #27ae60, #219a52);
    }

    .summary-card.balance {
      background: linear-gradient(135deg, #f39c12, #e67e22);
    }

    .summary-card.profit-loss {
      background: linear-gradient(135deg, #2c3e50, #34495e);
      cursor: pointer;
    }

    .summary-card.profit-loss:hover {
      transform: scale(1.02);
    }

    .profit-indicator {
      font-size: 18px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 10px;
      display: inline-block;
    }

    .summary-card h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .summary-card .amount {
      font-size: 28px;
      font-weight: 700;
    }

    /* Expense List Styling */
    .expense-section {
      margin-top: 20px;
    }

    .expense-section-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1f36;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Type Toggle */
    .type-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .type-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e3e8ee;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #6b7385;
      transition: all 0.3s ease;
    }

    .type-btn.active {
      border-color: #635BFF;
      background: #635BFF;
      color: white;
    }

    .type-btn:hover:not(.active) {
      border-color: #635BFF;
    }

    /* Form Sections - hidden by default */
    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .income-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .income-type-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e3e8ee;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #6b7385;
      transition: all 0.3s ease;
    }

    .income-type-btn.active {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .income-type-btn:hover:not(.active) {
      border-color: #27ae60;
    }

    /* Date Range Picker */
    .date-range {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .date-input {
      padding: 8px 12px;
      border: 2px solid #e3e8ee;
      border-radius: 6px;
      font-size: 14px;
    }

    .date-input:focus {
      outline: none;
      border-color: #635BFF;
    }

    /* Income Form Styles */
    .income-section {
      margin-top: 30px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(39, 174, 96, 0.05), rgba(33, 150, 82, 0.05));
      border-radius: 12px;
      border: 1px solid rgba(39, 174, 96, 0.2);
    }

    .income-section h3 {
      margin: 0 0 20px 0;
      color: #27ae60;
      font-size: 20px;
    }

    .income-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .income-form .input-group {
      margin: 0;
    }

    .income-form .submit-btn {
      background: linear-gradient(135deg, #27ae60, #219a52);
      grid-column: 1 / -1;
    }

    .income-form .submit-btn:hover {
      box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
    }

    /* Side Hustle Section */
    .side-hustle-section {
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(99, 91, 255, 0.05), rgba(82, 69, 216, 0.05));
      border-radius: 12px;
      border: 1px solid rgba(99, 91, 255, 0.2);
    }

    .side-hustle-section h3 {
      margin: 0 0 15px 0;
      color: #635BFF;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .side-hustle-form {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 15px;
      align-items: end;
    }

    .side-hustle-form .submit-btn {
      background: linear-gradient(135deg, #635BFF, #5245d8);
      height: 48px;
    }

    .side-hustle-form .submit-btn:hover {
      box-shadow: 0 5px 15px rgba(99, 91, 255, 0.3);
    }

    .side-hustle-examples {
      margin-top: 10px;
      font-size: 13px;
      color: #6b7385;
    }

    .side-hustle-examples span {
      display: inline-block;
      background: rgba(99, 91, 255, 0.1);
      padding: 4px 10px;
      border-radius: 15px;
      margin: 3px 3px 0 0;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card" style="max-width:950px; width:100%;">

      <div class="page-header">
        <div>
          <h1 style="margin: 0 0 5px 0;">Expense Tracker</h1>
          <p style="margin: 0;">Manage your expenses and income</p>
        </div>
        <div class="header-buttons">
          <button class="logout-btn" onclick="logout()">
            🚪 Logout
          </button>
          <button type="button" class="leaderboard-btn" onclick="handleLeaderboard()" id="leaderboardBtn">
            🏆 Leaderboard
          </button>
          <button type="button" class="premium-btn" id="premiumBtn" onclick="goToPremium()">
            💎 Buy Premium
          </button>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="summary-cards" id="summaryCards">
        <div class="summary-card expense">
          <h3>💸 Total Expenses</h3>
          <div class="amount" id="totalExpenses">$0.00</div>
        </div>
      </div>

      <!-- Expense Form Section -->
      <div id="expenseFormSection" class="form-section active" style="display: block !important;">
        <form id="expenseForm" class="login-form" style="display: block !important;">

          <div class="input-group">
            <input type="number" id="amount" required placeholder=" ">
            <label>Amount</label>
            <div class="input-border"></div>
          </div>

          <div class="input-group">
            <input type="text" id="description" required placeholder=" ">
            <label>Description</label>
            <div class="input-border"></div>
          </div>

          <label for="category">Choose a category:</label>
          <input type="text" id="category" name="category" placeholder="AI will suggest..." style="width:100%; padding:12px; border:1px solid #e3e8ee; border-radius:6px; font-size:16px;">
          <div id="ai-suggestion-container"></div>
          
          <button id="aiInsightsBtn" class="ai-insights-btn" type="button" onclick="handleInsights()">
            🧠 AI Insights
          </button>
          <br><br>

          <button type="submit" class="submit-btn">💸 Add Expense</button>

        </form>
      </div>

      <!-- Expense/Income List -->
      <div class="expense-section">
        <h2 class="expense-section-title" id="listTitle">
          📋 All Expenses
        </h2>
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 15px;">
          <label for="categoryFilter" style="font-weight: 600; color: #6b7385;">Filter:</label>
          <select id="categoryFilter" onchange="changeCategoryFilter()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer;">
            <option value="daily">Today</option>
            <option value="monthly">This Month</option>
            <option value="yearly">This Year</option>
            <option value="all">All Time</option>
          </select>
          <label for="itemsPerPage" style="font-weight: 600; color: #6b7385;">Show:</label>
          <select id="itemsPerPage" onchange="changeItemsPerPage()" style="padding: 8px 12px; border: 2px solid #e3e8ee; border-radius: 6px; font-size: 14px; cursor: pointer;">
            <option value="5">5 items</option>
            <option value="10">10 items</option>
            <option value="15">15 items</option>
            <option value="20">20 items</option>
          </select>
        </div>
        <ul id="expenseList" style="list-style:none;padding-left:0;"></ul>
        <div class="pagination-controls" id="paginationControls" style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px;">
          <button id="prevPageBtn" onclick="prevPage()" style="padding: 10px 20px; background: #635BFF; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px;">◀</button>
          <span id="pageInfo" style="font-weight: 600; color: #1a1f36;">Page 1</span>
          <button id="nextPageBtn" onclick="nextPage()" style="padding: 10px 20px; background: #635BFF; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px;">▶</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: white; padding: 20px; border-radius: 8px; max-width: 500px; width: 90%; max-height: 70%; overflow-y: auto;">
      <h2>🏆 Expense Leaderboard</h2>
      <div id="leaderboardList"></div>
      <button onclick="closeModal()" style="margin-top: 20px; padding: 10px 20px; background: #635BFF; color: white; border: none; border-radius: 5px; cursor: pointer;">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/script.js"></script>
  <script>
    // Global state
    let currentCategory = 'daily';
    let currentTimeFilter = 'daily';
    let currentViewType = 'expense';
    let isPremiumUser = false;
    let allExpenses = [];
    let currentPage = 1;
    let itemsPerPage = parseInt(localStorage.getItem('expensesPerPage')) || 5;
    let filteredItemsData = [];

    // Load items per page from localStorage on page load
    document.addEventListener('DOMContentLoaded', function() {
      const savedItemsPerPage = localStorage.getItem('expensesPerPage');
      if (savedItemsPerPage) {
        itemsPerPage = parseInt(savedItemsPerPage);
        document.getElementById('itemsPerPage').value = itemsPerPage;
      }
    });

    // Change items per page
    function changeItemsPerPage() {
      itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
      localStorage.setItem('expensesPerPage', itemsPerPage);
      currentPage = 1;
      renderEntries(allExpenses);
    }

    // Change category filter
    function changeCategoryFilter() {
      currentCategory = document.getElementById('categoryFilter').value;
      currentPage = 1;
      renderEntries(allExpenses);
      updateListTitle();
    }

    // Update list title based on filters
    function updateListTitle() {
      const titles = {
        'daily': '📋 Today\'s Expenses',
        'monthly': '📋 This Month\'s Expenses',
        'yearly': '📋 This Year\'s Expenses',
        'all': '📋 All Expenses'
      };
      document.getElementById('listTitle').textContent = titles[currentCategory] || '📋 All Expenses';
    }

    // Check and update premium status
    async function checkPremiumStatus() {
      const token = getToken();
      if (!token) return;

      try {
        const response = await axios.get('/api/payment/premium-status');
        const { isPremium, premiumTier = 0 } = response.data;
        
        console.log('✅ Premium status check:', isPremium, 'Tier:', premiumTier);
        isPremiumUser = isPremium;
        
        // Apply premium background styling
        if (isPremium) {
          document.body.classList.add('premium-user');
          
          // Clear existing styles first, then set premium background
          document.body.style.cssText = 'background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; background-color: #667eea !important; background-attachment: fixed !important; min-height: 100vh; display: block;';
          
          console.log('🎨 Premium background applied, isPremium:', isPremium);
          
          // Add premium indicator to header
          const headerDiv = document.querySelector('.page-header > div > h1');
          if (headerDiv) {
            headerDiv.innerHTML = `Expense Tracker <span style="background: linear-gradient(135deg, #f39c12, #e67e22); color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-left: 10px;">⭐ ${premiumTier === 3 ? 'ELITE' : premiumTier === 2 ? 'PLUS' : 'BASIC'}</span>`;
          }
          
          // Add premium star indicator on the side
          let starIndicator = document.getElementById('premiumStarIndicator');
          if (!starIndicator) {
            starIndicator = document.createElement('div');
            starIndicator.id = 'premiumStarIndicator';
            starIndicator.className = 'premium-star-indicator';
            starIndicator.textContent = premiumTier === 3 ? 'ELITE' : premiumTier === 2 ? 'PLUS' : 'BASIC';
            document.body.appendChild(starIndicator);
          } else {
            starIndicator.style.display = 'block';
          }
          
          console.log('🎨 Premium background applied');
        } else {
          // Ensure premium styles are removed for non-premium users
          document.body.classList.remove('premium-user');
          document.body.style.background = '';
          document.body.style.backgroundImage = '';
          document.body.style.backgroundAttachment = '';
          
          // Hide premium star indicator
          const starIndicator = document.getElementById('premiumStarIndicator');
          if (starIndicator) {
            starIndicator.style.display = 'none';
          }
        }
        
        const premiumBtn = document.getElementById('premiumBtn');
        const leaderboardBtn = document.getElementById('leaderboardBtn');
        
        if (isPremium) {
          const tierNames = ['Free', 'Basic', 'Plus', 'Elite'];
          const tierName = tierNames[premiumTier] || 'Premium';

    // Set view type (expense/income) - simplified to expense only
    function setViewType(type) {
      currentViewType = type;
      document.getElementById('expenseTab').classList.toggle('active', type === 'expense');
      fetchAndRenderEntries();
    }

    // Fetch and render entries based on current filters
    async function fetchAndRenderEntries() {
      const token = getToken();
      if (!token) return;

      try {
        const expenseRes = await axios.get('/api/auth/get-expenses');
        allExpenses = expenseRes.data || [];

        // Calculate total
        const totalExpense = allExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
        document.getElementById('totalExpenses').textContent = '$' + totalExpense.toFixed(2);

        // Render entries
        renderEntries(allExpenses);

      } catch (err) {
        console.error('Error fetching entries:', err);
      }
    }

    // Render entries list
    function renderEntries(items) {
      const list = document.getElementById('expenseList');
      list.innerHTML = '';

      if (!items || items.length === 0) {
        const empty = document.createElement('li');
        empty.textContent = 'No expenses yet';
        empty.style.color = '#8792a2';
        empty.style.padding = '20px';
        empty.style.textAlign = 'center';
        list.appendChild(empty);
        document.getElementById('paginationControls').style.display = 'none';
        return;
      }

      // Apply category filter before rendering
      const filteredItems = filterByCategory(items);
      filteredItemsData = filteredItems;
      
      if (filteredItemsData.length === 0) {
        const empty = document.createElement('li');
        empty.textContent = 'No expenses found';
        empty.style.color = '#8792a2';
        empty.style.padding = '20px';
        empty.style.textAlign = 'center';
        list.appendChild(empty);
        document.getElementById('paginationControls').style.display = 'none';
        return;
      }

      // Reset to page 1 when data changes
      currentPage = 1;
      
      // Update pagination controls
      updatePaginationControls();

      // Use the reusable render function
      renderPaginatedItems();
    }

    // Update pagination controls
    function updatePaginationControls() {
      const totalPages = Math.ceil(filteredItemsData.length / itemsPerPage);
      const paginationControls = document.getElementById('paginationControls');
      const pageInfo = document.getElementById('pageInfo');
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');

      if (totalPages <= 1) {
        paginationControls.style.display = 'none';
        return;
      }

      paginationControls.style.display = 'flex';
      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      prevBtn.style.opacity = currentPage === 1 ? '0.5' : '1';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.style.opacity = currentPage === totalPages ? '0.5' : '1';
    }

    // Next page
    function nextPage() {
      const totalPages = Math.ceil(filteredItemsData.length / itemsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderPaginatedItems();
      }
    }

    // Previous page
    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPaginatedItems();
      }
    }

      paginatedItems.forEach(item => {

    // Filter items by category (daily/monthly/yearly)
    function filterByCategory(items) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      if (currentCategory === 'all') {
        return items;
      }
      
      return items.filter(item => {
        const itemDate = new Date(item.createdAt);
        
        switch(currentCategory) {
          case 'daily':
            const itemDay = new Date(itemDate.getFullYear(), itemDate.getMonth(), itemDate.getDate());
            return itemDay.getTime() === today.getTime();
          case 'monthly':
            return itemDate.getFullYear() === now.getFullYear() && 
                   itemDate.getMonth() === now.getMonth();
          case 'yearly':
            return itemDate.getFullYear() === now.getFullYear();
          default:
            return true;
        }
      });
    }

    // Save inline edit
    function saveInlineEdit(item, rowElement) {
      const descInput = rowElement.querySelector('.inline-edit-desc');
      const amtInput = rowElement.querySelector('.inline-edit-amount');
      
      if (!descInput || !amtInput) {
        console.error('Edit inputs not found');
        return;
      }

      const newAmount = parseFloat(amtInput.value);
      const newDescription = descInput.value.trim();

      if (isNaN(newAmount) || newAmount < 0) {
        showToast('Please enter a valid amount', 'error');
        return;
      }

      if (!newDescription) {
        showToast('Please enter a description', 'error');
        return;
      }

      console.log('Updating expense:', item.id, { amount: newAmount, description: newDescription });
      
      axios.put(`/api/auth/update-expense/${item.id}`, {
        amount: newAmount,
        description: newDescription
      }).then((response) => {
        console.log('Update response:', response.data);
        
        // Update local data without full refresh
        const oldAmount = parseFloat(item.amount || 0);
        item.amount = newAmount;
        item.description = newDescription;

        // Update totals in real-time
        updateTotalsFromChange('expense', oldAmount, newAmount);

        // Restore view mode with new values
        restoreRowView(rowElement, item);

        currentlyEditingId = null;
        showToast('✅ Entry updated successfully!', 'success');
        
        // Refresh to ensure consistency
        fetchAndRenderEntries();
      }).catch(err => {
        console.error('Update failed:', err.response?.data || err.message);
        showToast('Update failed: ' + (err.response?.data?.error || 'Unknown error'), 'error');
        cancelInlineEdit();
      });
    }

    // Cancel inline edit and restore original values
    function cancelInlineEdit() {
      if (!currentlyEditingId) return;

      // Find the row being edited
      const editRow = document.querySelector(`[data-edit-id="${currentlyEditingId}"]`);
      if (editRow) {
        const item = allExpenses.find(e => e.id === currentlyEditingId);
        if (item) {
          restoreRowView(editRow, item);
        }
      }

      currentlyEditingId = null;
    }

    // Update totals in real-time without full refresh
    function updateTotalsFromChange(entryType, oldAmount, newAmount) {
      const totalExpense = allExpenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
      animateTotalUpdate('totalExpenses', totalExpense);

    // Animate total value change
    function animateTotalUpdate(elementId, newValue) {
      const element = document.getElementById(elementId);
      if (!element) return;
      
      element.style.transition = 'transform 0.3s ease, color 0.3s ease';
      element.style.transform = 'scale(1.2)';
      element.textContent = '$' + newValue.toFixed(2);
      
      setTimeout(() => {
        element.style.transform = 'scale(1)';
      }, 150);
    }

              amount, 
              description, 
              category,
              status: 'pending'

            console.log('📥 Response received:', response.data);
            expenseForm.reset();
            fetchAndRenderEntries();
            alert('Entry added successfully!');
          } catch (err) {
            console.error('❌ Add expense error:', err);
            console.error('❌ Error response:', err.response?.data);
            alert(err.response?.data?.error || 'Failed to add entry');
          }
        });
      }

      // AI Category Suggestion
      let aiSuggestionTimeout;
      const descriptionEl = document.getElementById('description');
      const categoryEl = document.getElementById('category');
      if (descriptionEl && categoryEl) {
        descriptionEl.addEventListener('input', async () => {
          const desc = descriptionEl.value.trim();
          if (desc.length < 3) return;

          clearTimeout(aiSuggestionTimeout);
          aiSuggestionTimeout = setTimeout(async () => {
            try {
              const res = await axios.get(`/api/auth/suggest-category?description=${encodeURIComponent(desc)}`);
              const { suggestedCategory } = res.data;
              if (suggestedCategory) {
                categoryEl.value = suggestedCategory;
                showAISuggestion(suggestedCategory);
              }
            } catch (err) {
              console.error("AI Suggestion Error", err);
            }
          }, 500);
        });
      }

    function showAISuggestion(category) {
      const categoryEl = document.getElementById('category');
      let suggEl = document.getElementById('aiSuggestion');
      
      if (!suggEl && categoryEl) {
        suggEl = document.createElement('div');
        suggEl.id = 'aiSuggestion';
        suggEl.style.cssText = 'color: #10b981; font-size: 14px; margin-top: 4px; font-style: italic;';
        categoryEl.parentNode.appendChild(suggEl);
      }
      
      if (suggEl) {
        suggEl.textContent = `🤖 AI suggests: ${category}`;
      }
    }
  </script>
